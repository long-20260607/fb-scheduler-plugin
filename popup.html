<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        .status-section {
            margin-bottom: 20px;
        }
        .status-item {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .status-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .status-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .status-active {
            color: #52c41a;
        }
        .status-inactive {
            color: #f5222d;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #1890ff;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #1890ff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #40a9ff;
        }
        .btn-primary:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #666;
        }
        .btn-secondary:hover {
            background-color: #e8e8e8;
        }
        .message {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }
        .message-success {
            background-color: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .message-error {
            background-color: #fff2f0;
            color: #f5222d;
            border: 1px solid #ffccc7;
        }
        .loading {
            display: none;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
        }
        .footer-icon {
            font-size: 13px;
            margin-right: 4px;
        }
        .footer-label {
            color: #999;
        }
        .footer-value {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>插件激活</h2>
    </div>
    
    <div id="activeStatus" class="status-section" style="display: none;">
        <div class="status-item">
            <div class="status-label">激活状态</div>
            <div class="status-value status-active">已激活</div>
        </div>
        <div class="status-item">
            <div class="status-label">到期时间</div>
            <div class="status-value" id="expireTime">-</div>
        </div>
        <div class="status-item">
            <div class="status-label">激活码</div>
            <div class="status-value" id="activeCode">-</div>
        </div>
        <div class="button-group">
            <button class="btn-primary" id="startBtn">开始</button>
            <button class="btn-secondary" style="display:none;" id="cancelActiveBtn">取消激活</button>
        </div>
    </div>
    
    <div id="inactiveStatus" class="status-section" style="display: none;">
        <div class="status-item">
            <div class="status-label">激活状态</div>
            <div class="status-value status-inactive">未激活</div>
        </div>
        <div class="input-group">
            <label>激活码</label>
            <input type="text" id="codeInput" placeholder="请输入激活码">
        </div>
        <div class="button-group">
            <button class="btn-primary" id="activeBtn">激活</button>
        </div>
    </div>
    
    <div class="message" id="message"></div>
    <div class="loading" id="loading">处理中...</div>

    <div class="footer">
        <span class="footer-icon">✉</span>
        <span class="footer-label">联系方式：</span>
        <span class="footer-value">576817275@qq.com</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
