<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        .status-section {
            margin-bottom: 20px;
        }
        .status-item {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .status-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .status-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .status-active {
            color: #52c41a;
        }
        .status-inactive {
            color: #f5222d;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #1890ff;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #1890ff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #40a9ff;
        }
        .btn-primary:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #666;
        }
        .btn-secondary:hover {
            background-color: #e8e8e8;
        }
        .message {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }
        .message-success {
            background-color: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .message-error {
            background-color: #fff2f0;
            color: #f5222d;
            border: 1px solid #ffccc7;
        }
        .loading {
            display: none;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
        }
        .footer-icon {
            font-size: 13px;
            margin-right: 4px;
        }
        .footer-label {
            color: #999;
        }
        .footer-value {
            color: #666;
        }
        .queue-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        .queue-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .queue-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .queue-status {
            font-size: 12px;
            color: #666;
        }
        .queue-status.processing {
            color: #1890ff;
            font-weight: 500;
        }
        .tab-queue {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .tab-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 4px;
            background: white;
            border-radius: 4px;
            font-size: 12px;
            border-left: 3px solid #d9d9d9;
            transition: all 0.3s;
        }
        .tab-item.active {
            background: #e6f7ff;
            border-left-color: #1890ff;
        }
        .tab-item.pending { border-left-color: #d9d9d9; }
        .tab-item.processing { border-left-color: #1890ff; background: #e6f7ff; }
        .tab-item.completed { border-left-color: #52c41a; }
        .tab-item.error { border-left-color: #f5222d; }
        .tab-index {
            width: 22px;
            height: 22px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            font-weight: 500;
            flex-shrink: 0;
        }
        .tab-item.active .tab-index {
            background: #1890ff;
            color: white;
        }
        .tab-item.completed .tab-index {
            background: #52c41a;
            color: white;
        }
        .tab-item.error .tab-index {
            background: #f5222d;
            color: white;
        }
        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #333;
        }
        .tab-status {
            margin-left: 8px;
            color: #666;
            white-space: nowrap;
        }
        .queue-buttons {
            display: flex;
            gap: 10px;
        }
        #stopQueueBtn {
            display: none;
            background-color: #ff4d4f;
            color: white;
        }
        #stopQueueBtn:hover {
            background-color: #ff7875;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>插件激活</h2>
    </div>

    <div id="activeStatus" class="status-section" style="display: none;">
        <div class="status-item">
            <div class="status-label">激活状态</div>
            <div class="status-value status-active">已激活</div>
        </div>
        <div class="status-item">
            <div class="status-label">到期时间</div>
            <div class="status-value" id="expireTime">-</div>
        </div>
        <div class="status-item">
            <div class="status-label">激活码</div>
            <div class="status-value" id="activeCode">-</div>
        </div>
        <div class="button-group">
            <button class="btn-primary" id="startBtn">开始</button>
            <button class="btn-secondary" style="display:none;" id="cancelActiveBtn">取消激活</button>
        </div>
    </div>

    <div id="inactiveStatus" class="status-section" style="display: none;">
        <div class="status-item">
            <div class="status-label">激活状态</div>
            <div class="status-value status-inactive">未激活</div>
        </div>
        <div class="input-group">
            <label>激活码</label>
            <input type="text" id="codeInput" placeholder="请输入激活码">
        </div>
        <div class="button-group">
            <button class="btn-primary" id="activeBtn">激活</button>
        </div>
    </div>

    <div class="message" id="message"></div>
    <div class="loading" id="loading">处理中...</div>

    <!-- 多标签页队列管理 -->
    <div id="queueSection" class="queue-section" style="display: none;">
        <div class="queue-header">
            <span class="queue-title">标签页队列</span>
            <span class="queue-status" id="queueStatus">就绪</span>
        </div>
        <div id="tabQueue" class="tab-queue"></div>
        <div class="queue-buttons">
            <button class="btn-primary" id="startQueueBtn">开始处理</button>
            <button id="stopQueueBtn">停止</button>
        </div>
    </div>

    <!--<div class="footer">
        <span class="footer-icon">✉</span>
        <span class="footer-label">联系方式：</span>
        <span class="footer-value">576817275@qq.com</span>
    </div>-->

    <script src="popup.js"></script>
</body>
</html>
