<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        .status-section {
            margin-bottom: 20px;
        }
        .status-item {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .status-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .status-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .status-active {
            color: #52c41a;
        }
        .status-inactive {
            color: #f5222d;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #1890ff;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #1890ff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #40a9ff;
        }
        .btn-primary:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #666;
        }
        .btn-secondary:hover {
            background-color: #e8e8e8;
        }
        .message {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }
        .message-success {
            background-color: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .message-error {
            background-color: #fff2f0;
            color: #f5222d;
            border: 1px solid #ffccc7;
        }
        .loading {
            display: none;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
        }
        .footer-icon {
            font-size: 13px;
            margin-right: 4px;
        }
        .footer-label {
            color: #999;
        }
        .footer-value {
            color: #666;
        }
        /* 多标签启动间隔输入 */
        .stagger-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }
        .stagger-row label {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }
        .stagger-row input {
            width: 70px;
            padding: 6px 8px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .stagger-row input:focus {
            outline: none;
            border-color: #1890ff;
        }
        .stagger-tip {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            line-height: 1.4;
        }
        /* 多标签运行状态面板 */
        #runPanel {
            display: none;
            margin-bottom: 20px;
        }
        .run-panel-title {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .run-reset {
            font-size: 11px;
            color: #1890ff;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            flex: none;
        }
        .run-item {
            padding: 8px 10px;
            background: #f5f5f5;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .run-item-head {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .run-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #333;
            font-weight: 500;
        }
        .run-status {
            color: #1890ff;
            white-space: nowrap;
        }
        .run-message {
            color: #999;
            font-size: 11px;
            margin-top: 2px;
            word-break: break-all;
        }
        .run-done .run-status { color: #52c41a; }
        .run-error .run-status { color: #f5222d; }
        /* 确认弹层 */
        .confirm-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .confirm-box {
            background: #fff;
            border-radius: 8px;
            width: 320px;
            max-width: 92%;
            max-height: 85%;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
        }
        .confirm-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .confirm-desc {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .confirm-list {
            overflow-y: auto;
            flex: 1;
            margin-bottom: 12px;
            border: 1px solid #f0f0f0;
            border-radius: 4px;
        }
        .confirm-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 8px;
            font-size: 12px;
            color: #333;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }
        .confirm-tab:last-child {
            border-bottom: none;
        }
        .confirm-tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .confirm-tab-flag {
            color: #fa8c16;
            font-size: 11px;
            white-space: nowrap;
        }
        .confirm-tab-warn {
            opacity: 0.75;
        }
        .confirm-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>插件激活</h2>
    </div>

    <div id="activeStatus" class="status-section" style="display: none;">
        <div class="status-item">
            <div class="status-label">激活状态</div>
            <div class="status-value status-active">已激活</div>
        </div>
        <div class="status-item">
            <div class="status-label">到期时间</div>
            <div class="status-value" id="expireTime">-</div>
        </div>
        <div class="status-item">
            <div class="status-label">激活码</div>
            <div class="status-value" id="activeCode">-</div>
        </div>
        <div class="button-group">
            <button class="btn-primary" id="startBtn">开始</button>
            <button class="btn-primary" id="nextDayBtn" style="background-color: #722ed1;">次日定时</button>
            <button class="btn-secondary" style="display:none;" id="cancelActiveBtn">取消激活</button>
        </div>
        <div class="input-group" style="margin-top: 15px;">
            <label>自定义描述（可选）</label>
            <textarea id="customDescriptionInput" rows="1" placeholder="留空则复制第一行描述到其他行" style="width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; box-sizing: border-box; resize: none; overflow-y: auto; min-height: 36px; max-height: 120px;"></textarea>
        </div>
        <div class="stagger-row">
            <label for="staggerInput">标签启动间隔</label>
            <input type="number" id="staggerInput" min="0" max="600" value="5">
            <span style="font-size: 12px; color: #666;">秒</span>
        </div>
        <div class="stagger-tip">多标签执行时，各标签按此间隔错峰启动，降低风控与卡顿。仅执行 1 个标签时无影响。</div>

        <div id="runPanel">
            <div class="run-panel-title">
                <span>多标签运行状态</span>
                <button class="run-reset" id="runResetBtn">清除记录</button>
            </div>
            <div id="runList"></div>
        </div>
    </div>

    <div id="inactiveStatus" class="status-section" style="display: none;">
        <div class="status-item">
            <div class="status-label">激活状态</div>
            <div class="status-value status-inactive">未激活</div>
        </div>
        <div class="input-group">
            <label>激活码</label>
            <input type="text" id="codeInput" placeholder="请输入激活码">
        </div>
        <div class="button-group">
            <button class="btn-primary" id="activeBtn">激活</button>
        </div>
    </div>

    <div class="message" id="message"></div>
    <div class="loading" id="loading">处理中...</div>

    <!--<div class="footer">
        <span class="footer-icon">✉</span>
        <span class="footer-label">联系方式：</span>
        <span class="footer-value">576817275@qq.com</span>
    </div>-->

    <script src="popup.js"></script>
</body>
</html>
